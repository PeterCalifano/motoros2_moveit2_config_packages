# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - group_1_follow_joint_trajectory
    - group_2_follow_joint_trajectory

  group_1_follow_joint_trajectory:
    type: FollowJointTrajectory
    action_ns: ""
    default: true
    joints:
      - group_1/joint_1
      - group_1/joint_2
      - group_1/joint_3
      - group_1/joint_4
      - group_1/joint_5
      - group_1/joint_6

  group_2_follow_joint_trajectory:
    type: FollowJointTrajectory
    action_ns: ""
    default: true
    joints:
      - group_2/joint_1
      - group_2/joint_2
      - group_2/joint_3
      - group_2/joint_4
      - group_2/joint_5
      - group_2/joint_6
